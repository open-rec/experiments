[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openrec-experiments"
version = "0.1.0"
description = "Reproducible research experiments on the OpenRec engineering stack"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<4", "pyarrow>=14,<24", "scikit-learn>=1.4,<2", "torch>=2.2,<3", "lightgbm>=4.3,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
semantic = ["sentence-transformers>=3,<6"]
synerise-official = ["pytorch-lightning==2.2.4", "torchmetrics==1.3.2", "setuptools<81"]

[project.scripts]
openrec-experiment = "openrec_experiments.cli:main"

[tool.setuptools.packages.find]
include = ["openrec_experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
