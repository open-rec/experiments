name: experiments
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_DEFAULT_TIMEOUT: '30'
      PIP_RETRIES: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          path: experiments
      - uses: actions/checkout@v7
        with:
          repository: open-rec/rec-algorithm
          # Includes sparse retrieval, candidate ranking, and dynamic feature contracts.
          ref: 25276f5a9b59d0e1267da76e6bd9823ba1aecccb
          path: rec-algorithm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            experiments/pyproject.toml
            experiments/requirements-tested.txt
      - name: Upgrade pip
        working-directory: experiments
        run: python -m pip install --upgrade pip
      - name: Install recorded dependencies
        working-directory: experiments
        run: python -m pip install -r requirements-tested.txt
      - name: Install project and test dependencies
        working-directory: experiments
        run: python -m pip install --verbose -e '.[test]'
      - name: Check dependencies
        working-directory: experiments
        run: python -m pip check
      - name: Unit and synthetic integration tests
        working-directory: experiments
        run: python -m pytest -q
